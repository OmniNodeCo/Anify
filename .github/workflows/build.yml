name: Anify App Build & Package

on:
  push:
    branches:
      - arena/01a0aacb-anify
      - main
  pull_request:
    branches:
      - arena/01a0aacb-anify
      - main

jobs:
  build-app:
    name: Build & Package Desktop App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build UI Application Assets
        run: npm run build:web

      - name: Package Standalone Desktop App (Linux & Portable)
        run: |
          npx electron-builder --linux zip dir || true
          mkdir -p release/standalone-app
          cp -r dist release/standalone-app/
          cp -r electron release/standalone-app/
          cp package.json release/standalone-app/

      - name: Upload Desktop App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anify-desktop-app
          path: release/
          retention-days: 14
